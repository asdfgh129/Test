name: free-nodes-collect

# 每日「采集」搬到 GitHub Actions（2026-10-31 起）。
# 为什么搬：本机访问 github.com 长期被阻断，采集要靠池里节点自建上行代理 + 镜像回退，
# 通道是最脆的一环（镜像失效、raw 404、匿名配额 403）。runner 直连 GitHub，
# 不用代理、不用镜像、配额从匿名 60/时变成 token 5000/时。
#
# 为什么只做「采集」不在这里验证：免费节点的可达高度依赖出口位置。runner 出口是
# Azure 数据中心 IP，大量节点会封数据中心 ASN，在这里判「不可达」是系统性假阴性。
# 所以这里用 --no-latency-sort 只做「下载 → 解析 → 去重 → 落盘」，
# 产物与本地跑逐条相同；TCP 可达探测与四内核实测留在本地第一窗口（collect_nodes.py --probe-only）。

on:
  schedule:
    # UTC 13:05 = 北京 21:05（主），UTC 13:20 = 北京 21:20（备份）。**两条 cron 互为备份**：
    # GitHub 调度器会迟到甚至漏派发——2026-11-01 的 13:05 那次迟了 5 小时 16 分，
    # 跑到次日 02:20 才启动，`date +%F` 已经是「明天」，当晚本地窗口一无所得
    # （Docs/known-issues.md 第 54/56 条）。备份那条只在前一条没产出时才真正采集。
    #
    # 备份为什么不放到更早（例如 20:20）：下面的「跳过判定」是「先到先采」，
    # 备份一旦早于主 cron 成功，主 cron 每天都会被跳过，于是**每晚固定用早 45 分钟的数据**，
    # 20:20~21:05 之间更新当日文件的仓库会系统性漏掉。备份只能放在主 cron 之后。
    # 代价是两条只隔 15 分钟，对「整体延迟数小时」这种情形帮助有限——那种情况靠
    # 本地第一窗口的 ci_dispatch.py 主动触发兜底（workflow_dispatch 不看调度队列）。
    #
    # 两个时刻都避开整点（Actions 整点排队最狠，延迟可能到 20~30 分钟），且都早于本地第一窗口（22:00）；
    # 21:20 + 采集 11 分钟 ≈ 21:31，离 22:00 还有 29 分钟余量。
    - cron: "5 13 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-nodes-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 让报告里 set 的遍历顺序稳定（如 max(set(tags), key=tags.count) 遇并列时），
      # 保证同一份输入在 CI 与本地产出同一份节点集合
      PYTHONHASHSEED: "0"
      # 日期口径跟本地一致；--date 仍显式传入，双保险
      TZ: Asia/Shanghai
      # 优先用配置的 PAT（5000/时、搜索 30/分）；没配就退回 Actions 内置 token（1000/时）
      GH_COLLECT_TOKEN: ${{ secrets.FREE_NODES_TOKEN || github.token }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 显式传分支名，而不是用事件里带的 sha（默认行为）。
          # 为什么：schedule 事件被拖到几小时后才启动时，同一晚的两条 cron 会排队，
          # 后一条按「事件那一刻」的 sha 检出 → 前一条刚推上去的采集产物它**看不见**
          # → 守卫误判「今天还没采」→ 重复采集 11 分钟 → push 非快进失败（known-issues 58）。
          # 传 ref 时 actions/checkout 会在 run 启动时重新 fetch 分支尖端，等于总是拿到最新提交。
          ref: ${{ github.ref_name }}

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跳过判定（远端今天已有产物就不再采）
        id: guard
        # 多条触发路径（两条 cron + 手动/兜底 dispatch）都可能撞在一起。判据与本地完全一致，
        # 只问一个问题：**远端 master 上**今天这一轮采集产物是否已就绪？
        # - 只看 `nodes_meta.date` 会把跨零点补跑的产物当成当晚的（known-issues 56）。
        # - 只看**工作区**会把排队的重复 run 判成「今天还没采」（known-issues 58）：
        #   排队的 run 检出的是事件那一刻的提交，前一条 run 之后推的产物看不见。
        #   所以这里强制从 origin/master 取 nodes_meta，把「已推上去」当成就绪的唯一凭据。
        # 判定逻辑只写在 src/publish_free_nodes.py 的 ci_ready_status 里，这里不重复实现。
        run: |
          set -uo pipefail
          PROD="$RUNNER_TEMP/ci-prod"
          mkdir -p "$PROD/nodes"
          # 显式 refspec：确保 origin/master 这个 ref 本身被更新，而不只是 FETCH_HEAD
          if git fetch --depth=1 origin +refs/heads/master:refs/remotes/origin/master; then
            if git show origin/master:free-nodes/nodes/nodes_meta.json > "$PROD/nodes/nodes_meta.json" 2>/dev/null; then
              echo "已从 origin/master 取到 nodes_meta.json（$(wc -c < "$PROD/nodes/nodes_meta.json") 字节）"
            else
              rm -f "$PROD/nodes/nodes_meta.json"
              echo "origin/master 上没有 nodes_meta.json"
            fi
          else
            rm -f "$PROD/nodes/nodes_meta.json"
            echo "fetch origin/master 失败，按「没有产物」处理（会重新采集）"
          fi
          # --workspace 指向临时根 + --dir 相对名：让 --ci-status 读远端那份，而不是工作区那份
          if python free-nodes/src/publish_free_nodes.py --ci-status \
               --workspace "$RUNNER_TEMP" --dir ci-prod; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "远端今天已有采集产物，跳过本次采集"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 采集（下载 / 解析 / 去重，不做 TCP 探测）
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "采集日：$DATE"
          python free-nodes/src/collect_nodes.py \
            --out free-nodes \
            --readme-only \
            --no-latency-sort \
            --uplink direct \
            --token "$GH_COLLECT_TOKEN" \
            --max-repos 80 --search-pages 2 --search-days 3 \
            --readme-date-tolerance 0 \
            --time-budget 1500 \
            --date "$DATE"

      - name: 提交采集产物
        # 守卫判定「今天已有产物」时连提交也不必跑：那种情况本 run 根本没采集，
        # 工作区是干净的，跑一遍只会打印一句「无变化」（known-issues 57 复盘）。
        if: steps.guard.outputs.skip != '1'
        # 只提交「下游要用的那几样」：候选清单 + 元数据 + 采集日志 + 仓库质量。
        # 不提交 v2ray/xray/clash/singbox 订阅文件——它们此刻还含 TCP 不可达节点，
        # 由本地第一窗口的 --probe-only 探测后重写再提交，避免公网订阅出现死节点。
        run: |
          set -euo pipefail
          git config user.name  "free-nodes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- \
            free-nodes/nodes/nodes_uris.txt \
            free-nodes/nodes/nodes_meta.json \
            free-nodes/Docs \
            free-nodes/src/seed_repos.json \
            free-nodes/src/repo_quality.json \
            free-nodes/CHANGELOGS.md
          if git diff --cached --quiet; then
            echo "本次采集无变化，跳过提交"
          else
            git commit -m "chore(free-nodes): CI 采集 $(TZ=Asia/Shanghai date +%F)"
            if ! git push; then
              # 兜底：并发已按 concurrency 串行化，正常不会撞；万一还是被拒，
              # 先问一句「远端有没有今天的产物」——有就说明另一条 run 已经推成功，
              # 数据没丢，别挂红叉（红叉多了真正的事故就没人看得见，known-issues 57/58）。
              git fetch --depth=1 origin +refs/heads/master:refs/remotes/origin/master || true
              git show origin/master:free-nodes/nodes/nodes_meta.json \
                > "$RUNNER_TEMP/ci-prod/nodes/nodes_meta.json" 2>/dev/null || true
              if python free-nodes/src/publish_free_nodes.py --ci-status \
                   --workspace "$RUNNER_TEMP" --dir ci-prod; then
                echo "::warning::push 被拒，但远端已有今天的采集产物，本次不计失败"
              else
                echo "::error::push 被拒且远端没有今天的产物，本次采集数据未入库"
                exit 1
              fi
            fi
          fi

      - name: 摘要
        if: always()
        run: |
          echo "### 采集结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f free-nodes/nodes/nodes_uris.txt ]; then
            echo "- 候选清单：$(grep -c '://' free-nodes/nodes/nodes_uris.txt || true) 条 URI" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 候选清单缺失（采集未产出）" >> "$GITHUB_STEP_SUMMARY"
          fi
